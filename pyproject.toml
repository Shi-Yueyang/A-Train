[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a-train"
version = "0.1.0"
description = "Deterministic, headless train simulator with external ATP integration over TCP/NDJSON."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "A-Train Project" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "asgi-lifespan>=2.1",
    "ruff>=0.4",
]

[project.scripts]
a-train = "a_train.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/a_train"]

[tool.hatch.build.targets.sdist]
include = ["src/a_train", "web", "scenarios", "README.md", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
